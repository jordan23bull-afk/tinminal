<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local Trading Dashboard</title>
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/toolbar.css">
  <link rel="stylesheet" href="css/sidebar.css">
  <script src="js/lightweight-charts.standalone.production.js"></script>
  <script src="js/socket.io.min.js"></script>
</head>
<body class="theme-dark">
  <div class="app-container">

    <!-- Top Toolbar -->
    <header class="toolbar">
      <div class="toolbar-left">
        <input type="hidden" id="symbol-input" value="SBER">
        <input type="hidden" id="source-select" value="moex">
      </div>
      <div class="toolbar-right">
        <span id="connection-status" class="status-disconnected">Disconnected</span>
        <div class="layout-selector" id="layout-selector">
          <button class="layout-trigger" id="layout-trigger" title="Раскладка графиков">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
              <rect x="1" y="1" width="6" height="6" rx="1"/>
              <rect x="9" y="1" width="6" height="6" rx="1"/>
              <rect x="1" y="9" width="6" height="6" rx="1"/>
              <rect x="9" y="9" width="6" height="6" rx="1"/>
            </svg>
            <span class="layout-trigger-text" id="layout-trigger-text">1</span>
          </button>
          <div class="layout-dropdown hidden" id="layout-dropdown">
            <div class="layout-grid" id="layout-grid"></div>
            <div class="layout-sync">
              <div class="layout-sync-title">Синхронизация</div>
              <label class="layout-sync-item">
                <span>Инструмент</span>
                <input type="checkbox" checked>
              </label>
              <label class="layout-sync-item">
                <span>Интервал</span>
                <input type="checkbox" checked>
              </label>
              <label class="layout-sync-item">
                <span>Перекрестие</span>
                <input type="checkbox" checked>
              </label>
              <label class="layout-sync-item">
                <span>Время</span>
                <input type="checkbox">
              </label>
              <label class="layout-sync-item">
                <span>Диапазон дат</span>
                <input type="checkbox">
              </label>
            </div>
          </div>
        </div>
        <button class="tool-btn" id="watchlist-toggle" title="Скрыть/показать список">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="1" width="14" height="14" rx="2"/><line x1="10" y1="1" x2="10" y2="15"/></svg>
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <div class="main-content">

      <!-- Left Sidebar - Drawing Tools -->
      <aside class="sidebar-left">
        <button class="tool-btn active" data-tool="crosshair" title="Crosshair">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="9" y1="0" x2="9" y2="18"/><line x1="0" y1="9" x2="18" y2="9"/></svg>
        </button>
        <button class="tool-btn" data-tool="trendline" title="Trend Line">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="2" y1="16" x2="16" y2="2"/></svg>
        </button>
        <button class="tool-btn" data-tool="fib" title="Fibonacci">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.2"><line x1="2" y1="3" x2="16" y2="3"/><line x1="2" y1="7" x2="16" y2="7"/><line x1="2" y1="11" x2="16" y2="11"/><line x1="2" y1="15" x2="16" y2="15"/></svg>
        </button>
        <button class="tool-btn" data-tool="horizontal" title="Horizontal Line">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="0" y1="9" x2="18" y2="9" stroke-dasharray="3 2"/></svg>
        </button>
        <button class="tool-btn" data-tool="rectangle" title="Rectangle">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="5" width="12" height="8" rx="1"/></svg>
        </button>
        <button class="tool-btn" data-tool="text" title="Text">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="currentColor"><text x="4" y="14" font-size="14" font-weight="bold">T</text></svg>
        </button>
        <div class="tool-separator"></div>
        <button class="tool-btn" data-tool="brush" title="Brush">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 15c2-4 4-8 7-10s4 0 5-2"/></svg>
        </button>
        <button class="tool-btn" data-tool="eraser" title="Eraser">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M7 16h8M3 11l4 4 8-8-4-4-8 8z"/></svg>
        </button>
        <div class="tool-separator"></div>
        <button class="tool-btn" id="magnet-btn" title="Magnet">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 2v6a4 4 0 008 0V2M4 2h4M10 2h4"/></svg>
        </button>
      </aside>

      <!-- Chart Area -->
      <main id="charts-grid" class="charts-grid">
      </main>

      <!-- Right Sidebar - Watchlist -->
      <aside class="sidebar-right">
        <div class="watchlist-header">
          <span class="watchlist-title">Список</span>
          <button class="icon-btn-sm">+</button>
        </div>
        <div class="watchlist-tabs">
          <button class="wl-tab active">Инструм.</button>
          <button class="wl-tab">Иzm. е</button>
          <button class="wl-tab">Объём</button>
        </div>
        <div class="watchlist-items">
          <div class="wl-section-header">MOEX</div>
          <div class="watchlist-item" data-symbol="SBER" data-source="moex">
            <div class="wl-icon moex">С</div>
            <div class="wl-info">
              <span class="wl-symbol">SBER</span>
              <span class="wl-price">280</span>
            </div>
            <span class="wl-change positive">+1.2%</span>
          </div>
          <div class="watchlist-item" data-symbol="GAZP" data-source="moex">
            <div class="wl-icon moex">Г</div>
            <div class="wl-info">
              <span class="wl-symbol">GAZP</span>
              <span class="wl-price">152</span>
            </div>
            <span class="wl-change negative">-0.8%</span>
          </div>
          <div class="watchlist-item" data-symbol="LKOH" data-source="moex">
            <div class="wl-icon moex">Л</div>
            <div class="wl-info">
              <span class="wl-symbol">LKOH</span>
              <span class="wl-price">7 450</span>
            </div>
            <span class="wl-change positive">+0.5%</span>
          </div>
          <div class="watchlist-item" data-symbol="YDEX" data-source="moex">
            <div class="wl-icon moex">Я</div>
            <div class="wl-info">
              <span class="wl-symbol">YDEX</span>
              <span class="wl-price">3 820</span>
            </div>
            <span class="wl-change positive">+2.1%</span>
          </div>
          <div class="watchlist-item" data-symbol="GMKN" data-source="moex">
            <div class="wl-icon moex">Н</div>
            <div class="wl-info">
              <span class="wl-symbol">GMKN</span>
              <span class="wl-price">14 200</span>
            </div>
            <span class="wl-change negative">-1.3%</span>
          </div>
        </div>

        <!-- Price Scale Info -->
        <div class="price-info">
          <div class="current-price">
            <span class="price-value" id="current-price">64 543</span>
            <span class="price-currency">USD</span>
          </div>
          <div class="price-change">
            <span class="change-abs">+103</span>
            <span class="change-pct">+0.16%</span>
          </div>
        </div>
      </aside>

    </div>

    <!-- Bottom Status Bar -->
    <footer class="statusbar">
      <div class="statusbar-left">
        <span id="status-text">Ready</span>
        <span class="status-sep">|</span>
        <span id="status-connection" class="status-disconnected">Disconnected</span>
      </div>
      <div class="statusbar-center">
        <div class="bottom-timeframe-buttons">
          <button data-btf="1D">1Д</button>
          <button data-btf="5D">5Д</button>
          <button data-btf="1M">1М</button>
          <button data-btf="3M">3М</button>
          <button data-btf="6M">6М</button>
          <button data-btf="YTD">YTD</button>
          <button data-btf="1Y">1Г</button>
          <button data-btf="5Y">5Л</button>
          <button data-btf="ALL" class="active">Все</button>
        </div>
      </div>
      <div class="statusbar-right">
        <span id="current-time">14:57:08 UTC+3</span>
      </div>
    </footer>

  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
